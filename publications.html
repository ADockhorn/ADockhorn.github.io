<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Publications – Alexander Dockhorn</title>
  <meta name="description" content="Full publication list of Alexander Dockhorn – 70 publications including journal papers, conference papers, book chapters, and more.">
  <script src="https://kit.fontawesome.com/532281899f.js" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <!-- ── Navigation ───────────────────────────────────────── -->
  <div data-include="header"></div>

  <main>

    <!-- ── Page header ──────────────────────────────────────── -->
    <div class="page-header">
      <div class="container">
        <h1>Publications</h1>
      </div>
    </div>

    <!-- ── Research Impact Metrics ──────────────────────────── -->
    <div class="metrics-strip">
      <div class="container">
        <div class="metrics-grid">
          <div class="metric-card">
            <span class="metric-number">70</span>
            <span class="metric-label">Publications</span>
          </div>
          <div class="metric-card">
            <span class="metric-number">64</span>
            <span class="metric-label">Peer-reviewed</span>
          </div>
          <div class="metric-card">
            <span class="metric-number">15</span>
            <span class="metric-label">h-Index</span>
          </div>
          <div class="metric-card">
            <span class="metric-number">926</span>
            <span class="metric-label">Citations</span>
          </div>
          <div class="metric-card">
            <span class="metric-number">23</span>
            <span class="metric-label">i10-Index</span>
          </div>
        </div>
        <p class="metrics-source">According to Google Scholar &mdash; April 2026</p>
      </div>
    </div>

    <!-- ── Filter bar ────────────────────────────────────────── -->
    <div class="filter-section">
      <div class="container">
        <div class="filter-bar">
          <input type="search" id="pub-search" class="search-input" placeholder="Search by title, author, venue&hellip;" aria-label="Search publications">
          <div class="filter-types" role="group" aria-label="Filter by type">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="incollection">Book Chapters</button>
            <button class="filter-btn" data-filter="article">Journals</button>
            <button class="filter-btn" data-filter="inproceedings">Conferences</button>
            <button class="filter-btn" data-filter="workshop">Workshops</button>
            <button class="filter-btn" data-filter="preprint">Preprints</button>
            <button class="filter-btn" data-filter="thesis">Theses</button>
          </div>
          <span class="pub-count-info" id="pub-count-info"></span>
        </div>
      </div>
    </div>

    <!-- ── Publications list ────────────────────────────────── -->
    <section class="section">
      <div class="container">
        <div id="publications-container">
          <p class="text-muted" style="padding: 2rem 0;">Loading publications&hellip;</p>
        </div>
      </div>
    </section>

  </main>

  <!-- ── Footer ───────────────────────────────────────────── -->
  <div data-include="footer"></div>

  <script src="assets/js/includes.js"></script>
  <script src="assets/js/site.js"></script>
  <script src="assets/js/bibtex-parser.js"></script>
  <script src="assets/js/publications.js"></script>
  <script>loadPublications('publications-container');</script>

</body>
</html>
